services:
  ysp-live:
    image: ghcr.io/evanzme/ysptp:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ysp-live-v9.5
    restart: unless-stopped
    ports:
      - "8767:8767"
    # 在 iStoreOS / OpenWrt 上如果需要 host 网络模式，可取消下行注释（使用 host 模式时需注释掉 ports）
    # network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - YSP_DATA_DIR=/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
