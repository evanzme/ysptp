[package]
name = "ysptp-project"
version = "0.1.0"
edition = "2021"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
cookie_store = "0.21"
flate2 = "1"
hex = "0.4"
md-5 = "0.10"
parking_lot = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "gzip", "rustls-tls", "json"] }
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha1 = "0.10"
sha2 = "0.10"
tiny_http = "0.12"
url = "2"
uuid = { version = "1", features = ["v4"] }
